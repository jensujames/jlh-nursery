version: '3.8'

services:
  app:
    build: .
    container_name: jlh_nursery_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/jlh_nursery
    depends_on:
      - mongo

  mongo:
    image: mongo:7-jammy
    container_name: jlh_nursery_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
